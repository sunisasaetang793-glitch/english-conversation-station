<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;font-size:18px;color:#14345b;background:linear-gradient(rgba(239,248,244,.38),rgba(255,248,233,.42)),url('assets/picture-talk-mountain-bg.png') center/cover fixed}.wrap{max-width:1180px;margin:auto;padding:18px}.panel{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid #fff;border-radius:25px;padding:22px;box-shadow:0 12px 32px #16375a24;margin-bottom:18px}.hero{min-height:330px;background:linear-gradient(105deg,rgba(10,52,62,.78),rgba(37,113,89,.42)),url('assets/picture-talk-mountain-bg.png') center/cover;color:#fff;display:flex;align-items:end}.hero h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:8px 0;text-shadow:0 5px 18px #071e2c}.hero p{font-size:21px}.tag,.score-chip{display:inline-block;padding:7px 11px;border-radius:999px;background:#ffe27a;color:#173b67;font-weight:900}.nav,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:14px;padding:12px 17px;min-height:50px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:linear-gradient(135deg,#16704b,#2ead72);color:#fff}.blue{background:linear-gradient(135deg,#246fc3,#3a9be0);color:#fff}.light{background:#eef5fa;color:#173b67;border:1px solid #cadae7}.game-tabs{display:grid;grid-template-columns:1fr 1fr;gap:15px}.game-tab{padding:22px;border-radius:20px;border:2px solid #d6e6ee;background:rgba(255,255,255,.9);cursor:pointer;text-align:left}.game-tab.active{border-color:#2b9f6d;background:linear-gradient(145deg,#edfff5,#eef7ff);box-shadow:0 8px 23px #17704b20}.game-tab h2{font-size:29px;margin:4px 0}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}select{width:100%;padding:12px;border:1px solid #cadae2;border-radius:13px;background:#fff;font:inherit}.status{padding:12px 14px;border-radius:14px;background:#edf8f2;margin-top:11px}.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.lesson{display:flex;gap:14px;align-items:center}.lesson-num{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#ffce4f,#ff9d5b);display:grid;place-items:center;font-size:27px;font-weight:950;color:#173b67;flex:none}.lesson h3{margin:0 0 5px}.lesson .btn{margin-left:auto}.play{display:none}.play.active{display:block}.progress{height:15px;border-radius:99px;background:#e1ebf0;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#ffcc4d,#27a96f);transition:.3s}.question{text-align:center}.question h2{font-size:clamp(28px,5vw,44px)}.picture-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pic-btn{padding:0;border:4px solid transparent;border-radius:19px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 7px 20px #173b6720}.pic{aspect-ratio:4/3;background-size:300% 500%;background-repeat:no-repeat}.pic-btn.correct{border-color:#25a863}.pic-btn.wrong{border-color:#e45263}.text-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.text-btn{min-height:72px;border:2px solid #cadde8;border-radius:16px;background:#fff;color:#173b67;font-size:23px;font-weight:900;cursor:pointer}.text-btn.correct{background:#dcf6e6;border-color:#25a863}.text-btn.wrong{background:#fee5e8;border-color:#e45263}.listen-box{font-size:22px;padding:16px;border-radius:16px;background:#eaf5ff;margin:12px auto;max-width:780px}.feedback{font-size:23px;font-weight:900;min-height:36px;margin-top:13px}.summary{text-align:center;padding:24px}.summary strong{font-size:58px;color:#16704b}@media(max-width:800px){body{font-size:20px;background-attachment:scroll}.wrap{padding:10px}.panel{padding:16px}.fields,.game-tabs,.lessons,.picture-choices,.text-choices{grid-template-columns:1fr}.hero{min-height:380px}.btn{width:100%}.lesson{flex-wrap:wrap}.lesson .btn{margin-left:0;width:100%}.picture-choices{grid-template-columns:repeat(3,1fr)}.text-choices{gap:8px}.text-btn{font-size:20px}}
</style></head><body><div class="wrap">
<header class="panel hero"><div><span class="tag">IVSAA MODEL • LISTENING & VOCABULARY</span><h1>Listen, Think & Play!</h1><p>ฟังเสียง AI ช้าและชัด แล้วสนุกกับเกมภาษาอังกฤษ ป.4–ม.3</p><nav class="nav"><a class="btn light" href="index.html">English Conversation</a><a class="btn light" href="picture-talk.html">Picture Talk</a><a class="btn light" href="speaking.html">Speaking Out Loud</a><a class="btn light" href="reading.html">Reading Part</a><a class="btn light" href="student-progress.html">คะแนนของฉัน</a></nav></div></header>
<section class="panel"><div class="game-tabs"><button class="game-tab active" id="listenTab"><span class="tag">GAME 1</span><h2>Listen and Choose</h2><p>ฟังประโยค แล้วเลือกภาพที่ตรงกัน</p></button><button class="game-tab" id="whoTab"><span class="tag">GAME 2</span><h2>Who Am I?</h2><p>ฟังคำใบ้ แล้วเลือกคำตอบให้ถูกต้อง</p></button></div></section>
<section class="panel"><h2>เลือกชั้นและชื่อนักเรียน</h2><div class="fields"><select id="grade"><option value="P4">ป.4</option><option value="P5">ป.5</option><option value="P6">ป.6</option><option value="M1">ม.1</option><option value="M2">ม.2</option><option value="M3">ม.3</option></select><select id="year"></select><select id="term"><option value="1">ภาคเรียน 1</option><option value="2">ภาคเรียน 2</option></select><select id="student"><option value="">— เลือกชื่อนักเรียน —</option></select></div><div class="status" id="studentStatus">กำลังโหลดรายชื่อ...</div></section>
<section id="lessonArea"><div class="lessons" id="lessons"></div></section>

</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{
const sb=supabase.createClient('https://zbmrjexpugcwawvmrtyo.supabase.co','sb_publishable_E7iFH6DFoonjDt5WdSYbSQ_HGTB8pbY'),$=id=>document.getElementById(id);
const grade=$('grade'),year=$('year'),term=$('term'),student=$('student'),studentStatus=$('studentStatus'),lessons=$('lessons'),play=$('play'),choices=$('choices'),feedback=$('feedback'),promptText=$('promptText');
const sceneNames=['classroom','kitchen','playground','zoo','market','park','farm','library','beach','rainy street','birthday party','bedroom','canteen','garden','shop'];
const prompts=[
 {p:'The students are in a classroom.',m:'Students are working together in the classroom.'},{p:'The family cooks in the kitchen.',m:'The family is preparing healthy food in the kitchen.'},{p:'Children play on the slide.',m:'The children are playing happily in the playground.'},{p:'I can see zoo animals.',m:'Students are watching wild animals at the zoo.'},{p:'The student buys some fruit.',m:'A student is buying colorful fruit at the market.'},
 {p:'The family has a picnic.',m:'A family is having a picnic with their dog in the park.'},{p:'Animals live on the farm.',m:'Students are helping to feed animals on a farm.'},{p:'The girl reads a book.',m:'Students are reading quietly in the school library.'},{p:'Children play on the beach.',m:'Children are building a sandcastle beside the sea.'},{p:'The girl has an umbrella.',m:'Students are walking with umbrellas on a rainy street.'},
 {p:'Friends have a birthday party.',m:'Friends are celebrating a birthday with a cake.'},{p:'The boy gets ready for school.',m:'A student is getting ready for school in his bedroom.'},{p:'Students eat lunch together.',m:'Students are eating and talking in the school canteen.'},{p:'I see insects and flowers.',m:'Butterflies and bees are flying around the garden.'},{p:'The student buys a snack.',m:'A student is buying something at a neighborhood shop.'}];
const people=[
 ['teacher','I work at school. I help students learn.','I teach lessons and help students in a classroom.',0],['student','I go to school. I read and learn.','I study subjects, read books and learn at school.',0],['book','I have many pages. You can read me.','I have pages and stories. People find me in a library.',7],['cook','I make food in a kitchen.','I prepare meals and work with food in a kitchen.',1],['mother','I am a woman in your family.','I am a female parent who takes care of a family.',1],
 ['football player','I kick a ball.','I run on a field and kick a ball into a goal.',2],['slide','Children go down me.','I am playground equipment that children climb and go down.',2],['elephant','I am big. I have a long nose.','I am a huge animal with large ears and a long trunk.',3],['giraffe','I am tall. I have a long neck.','I am the tallest land animal and I have a very long neck.',3],['zebra','I have black and white stripes.','I look like a horse and have black-and-white stripes.',3],
 ['fruit seller','I sell fruit at a market.','I work at a market and sell bananas and other fruit.',4],['pineapple','I am a fruit with a rough skin.','I am a tropical fruit with rough skin and leaves on top.',4],['dog','I am a friendly animal. I can bark.','I am a common pet that barks and likes people.',5],['basket','You put food inside me.','People carry food in me, especially for a picnic.',5],['farmer','I work with plants and animals.','I grow crops and take care of animals on a farm.',6],
 ['cow','I live on a farm. I give milk.','I am a large farm animal that gives people milk.',6],['goat','I live on a farm. I eat grass.','I am a farm animal with horns and I can climb well.',6],['librarian','I work with books in a library.','I help people find and borrow books in a library.',7],['beach','I have sand beside the sea.','People swim and relax on my sand beside the sea.',8],['sandcastle','Children make me with wet sand.','I look like a small castle and children build me from sand.',8],
 ['umbrella','I keep you dry in the rain.','People hold me over their heads when it rains.',9],['rain','I fall from clouds and make things wet.','I am water that falls from clouds and makes streets wet.',9],['birthday cake','I have candles on top.','People put candles on me and eat me at a birthday party.',10],['balloon','I am full of air at a party.','I am a colorful party decoration filled with air.',10],['alarm clock','I tell the time and wake you up.','I ring in the morning to help people wake up on time.',11],
 ['canteen','Students eat lunch in me.','I am a place at school where students buy and eat food.',12],['butterfly','I have colorful wings and visit flowers.','I am an insect with colorful wings that flies near flowers.',13],['bee','I am a small insect. I make honey.','I fly from flower to flower and make honey.',13],['shopkeeper','I sell things in a shop.','I help customers and sell products in a small shop.',14],['snack','You eat me between meals.','I am a small amount of food eaten between main meals.',14]
];
const lessonNames=['School Life','Family and Home','Play and Sports','Animals Around Us','Food and Market','Places Near Me','Daily Activities','Nature and Weather','People and Jobs','Review Challenge'];
let game='listen_choose',studentId='',lesson=0,q=0,score=0,current=null,best=new Map();
function beToCe(v){v=Number(v);return v>=2400?v-543:v}function gradeThai(v){return v.replace('P','ป.').replace('M','ม.')}function sprite(){return grade.value[0]==='P'?'assets/picture-talk-primary-sprite.png':'assets/picture-talk-secondary-sprite.png'}function pos(i){return `${(i%3)*50}% ${Math.floor(i/3)*25}%`}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.63;u.pitch=.97;speechSynthesis.speak(u)}
function populateYears(){const y=new Date().getFullYear()+543;for(let n=y-2;n<=y+5;n++)year.add(new Option('ปีการศึกษา '+n,n,n===y,n===y))}
async function loadStudents(){student.innerHTML='<option value="">— เลือกชื่อนักเรียน —</option>';studentId='';lessons.innerHTML='';studentStatus.textContent='กำลังโหลดรายชื่อ...';const {data:c,error}=await sb.from('school_classes').select('id').eq('grade_level',grade.value).eq('academic_year',beToCe(year.value)).eq('term',Number(term.value)).eq('is_active',true).maybeSingle();if(error||!c){studentStatus.textContent='ยังไม่พบห้องเรียนในปีการศึกษาและภาคเรียนนี้';return}const {data:ss,error:e}=await sb.from('students').select('id,student_no,full_name').eq('class_id',c.id).eq('is_active',true).order('student_no');if(e){studentStatus.textContent='โหลดรายชื่อไม่สำเร็จ';return}(ss||[]).forEach((s,i)=>student.add(new Option(`ลำดับที่ ${i+1} — ${s.full_name}`,s.id)));studentStatus.textContent=ss?.length?'เลือกชื่อแล้วเริ่มเกมได้เลย':'ห้องนี้ยังไม่มีรายชื่อนักเรียน'}
async function loadProgress(){best=new Map();if(!studentId)return;const {data,error}=await sb.rpc('get_student_progress',{p_student_id:Number(studentId),p_grade:grade.value,p_academic_year_be:Number(year.value),p_term:Number(term.value)});if(error){studentStatus.textContent='ยังอ่านคะแนนไม่ได้ กรุณาลองใหม่';return}(data||[]).filter(a=>a.activity_type===game).forEach(a=>best.set(a.lesson_title,Number(a.best_score)));renderLessons()}
function renderLessons(){lessons.innerHTML='';if(!studentId)return;lessonNames.forEach((name,i)=>{const key=`${game==='listen_choose'?'Listen and Choose':'Who Am I?'} ${i+1}: ${name}`,s=best.get(key);const el=document.createElement('article');el.className='panel lesson';el.innerHTML=`<div class="lesson-num">${i+1}</div><div><h3>${name}</h3><span class="score-chip">${s!=null?'ทำแล้ว '+s+'/10':'10 Questions • 10 Points'}</span></div><button class="btn primary">${s!=null?'เล่นอีกครั้ง':'เริ่มบทเรียน'}</button>`;el.querySelector('button').onclick=()=>start(i);lessons.appendChild(el)})}
function chooseGame(next){game=next;$('listenTab').classList.toggle('active',game==='listen_choose');$('whoTab').classList.toggle('active',game==='who_am_i');play.classList.remove('active');if(studentId)loadProgress()}
function start(i){lesson=i;q=0;score=0;play.classList.add('active');renderQuestion();play.scrollIntoView({behavior:'smooth',block:'start'})}
function makeListen(){const gi=['P4','P5','P6','M1','M2','M3'].indexOf(grade.value),target=(lesson*4+q+gi*2)%15,pool=[...Array(15).keys()].filter(x=>x!==target);return{target,prompt:grade.value[0]==='P'?prompts[target].p:prompts[target].m,options:shuffle([target,...shuffle(pool).slice(0,2)])}}
function makeWho(){const gi=['P4','P5','P6','M1','M2','M3'].indexOf(grade.value),idx=(lesson*7+q+gi*3)%people.length,item=people[idx],pool=people.map((x,i)=>i).filter(i=>i!==idx);return{target:idx,prompt:grade.value[0]==='P'?item[1]:item[2],options:shuffle([idx,...shuffle(pool).slice(0,2)])}}
function renderQuestion(){feedback.textContent='';$('progress').style.width=(q/10*100)+'%';$('qLabel').textContent=`${gradeThai(grade.value)} • Lesson ${lesson+1} • Question ${q+1}/10`;current=game==='listen_choose'?makeListen():makeWho();$('gameTitle').textContent=game==='listen_choose'?'Listen and choose the correct picture.':'Who am I?';promptText.textContent=game==='listen_choose'?'🔊 ฟังประโยคของ AI แล้วเลือกภาพ':'🔊 '+current.prompt;choices.className=game==='listen_choose'?'picture-choices':'text-choices';choices.innerHTML='';if(game==='listen_choose')current.options.forEach(scene=>{const b=document.createElement('button');b.className='pic-btn';b.innerHTML=`<div class="pic" style="background-image:url('${sprite()}');background-position:${pos(scene)}"></div>`;b.onclick=()=>answer(scene,b);choices.appendChild(b)});else current.options.forEach(idx=>{const b=document.createElement('button');b.className='text-btn';b.textContent=people[idx][0];b.onclick=()=>answer(idx,b);choices.appendChild(b)});setTimeout(()=>speak(current.prompt),300)}
function answer(value,button){[...choices.children].forEach(b=>b.disabled=true);const correct=value===current.target;if(correct){score++;button.classList.add('correct');feedback.textContent='✅ Correct! เก่งมากค่ะ';speak('Correct! Great job!')}else{button.classList.add('wrong');[...choices.children].forEach((b,i)=>{if(current.options[i]===current.target)b.classList.add('correct')});feedback.textContent=`คำตอบที่ถูกคือ ${game==='listen_choose'?'ภาพกรอบสีเขียว':people[current.target][0]}`;speak('Good try. The correct answer is '+(game==='listen_choose'?sceneNames[current.target]:people[current.target][0]))}setTimeout(()=>{q++;q<10?renderQuestion():finish()},1050)}
async function finish(){const prefix=game==='listen_choose'?'Listen and Choose':'Who Am I?',lessonTitle=`${prefix} ${lesson+1}: ${lessonNames[lesson]}`;$('progress').style.width='100%';choices.innerHTML=`<div class="summary"><h2>ทำบทเรียนเสร็จแล้ว</h2><strong>${score}/10</strong><p>${score>=9?'Excellent! 🌟':score>=7?'Very Good!':score>=5?'Good job!':'Keep practicing!'}</p><div class="status" id="saveStatus">กำลังบันทึกคะแนน...</div><div class="actions" style="justify-content:center"><button class="btn primary" id="nextLesson">ทำบทถัดไป</button><button class="btn light" id="backLessons">เลือกบทเรียน</button></div></div>`;promptText.textContent=lessonTitle;feedback.textContent='';const f=JSON.stringify({activity_type:game,grade:grade.value,lesson_title:lessonTitle,lesson_no:lesson+1,term:Number(term.value),academic_year_be:Number(year.value),academic_year_ad:beToCe(year.value),correct_answers:score,total_questions:10,score_out_of_10:score});let ok=false,err='';const rpc=await sb.rpc('save_student_attempt',{p_student_id:Number(studentId),p_station_no:1,p_score:score,p_feedback:f,p_response_mode:'choice'});if(!rpc.error)ok=true;else{err=rpc.error.message;const {data:s}=await sb.from('conversation_stations').select('id').eq('station_no',1).limit(1);if(s?.[0]){const d=await sb.from('attempts').insert({student_id:studentId,station_id:s[0].id,score,feedback:f,response_mode:'choice'});ok=!d.error;err=d.error?.message||err}}$('saveStatus').textContent=ok?'✅ บันทึกคะแนนเข้า Teacher Dashboard แล้ว':'⚠️ บันทึกไม่สำเร็จ: '+err;if(ok){best.set(lessonTitle,Math.max(best.get(lessonTitle)||0,score));renderLessons()}$('nextLesson').onclick=()=>start((lesson+1)%10);$('backLessons').onclick=()=>{play.classList.remove('active');$('lessonArea').scrollIntoView({behavior:'smooth'})}}
grade.onchange=loadStudents;year.onchange=loadStudents;term.onchange=loadStudents;student.onchange=()=>{studentId=student.value;studentStatus.textContent=studentId?'เลือกบทเรียนด้านล่างได้เลย':'กรุณาเลือกชื่อนักเรียน';loadProgress()};$('listenTab').onclick=()=>chooseGame('listen_choose');$('whoTab').onclick=()=>chooseGame('who_am_i');$('listen').onclick=()=>speak(current?.prompt||'Listen carefully.');$('quit').onclick=()=>{speechSynthesis.cancel();play.classList.remove('active');$('lessonArea').scrollIntoView({behavior:'smooth'})};const requestedGame=new URLSearchParams(location.search).get('game');if(requestedGame==='who')chooseGame('who_am_i');populateYears();loadStudents();
})();
</script></body></html>
